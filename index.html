<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Объявка</title>
<style>
:root{
  --bg:#0b0b0b; --surface:#262626; --surface2:#1c1c1c; --line:#333;
  --text:#f2f2f2; --muted:#8c8c8c; --blue:#0af; --blue-d:#0088cc;
  --green:#04e061; --red:#ff4d4f; --yellow:#ffb400;
  --c-teal:#a0e4d4; --c-orange:#fda57d; --c-green:#a3b88f; --c-purple:#c8a5cb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}

/* top bar */
.top{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand-name{font-size:21px;font-weight:700;letter-spacing:-.3px}
.balance{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:18px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.balance svg{color:var(--blue)}

.searchwrap{padding:4px 14px 10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;height:48px}
.search svg{color:var(--muted);flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--muted)}
.clear{display:none;color:var(--muted)}
.search.has .clear{display:block}

/* content */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 20px;-webkit-overflow-scrolling:touch}
.title{font-size:22px;font-weight:700;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative}
button.card:active{transform:scale(.98)}
.card .pic{width:100%;aspect-ratio:1/1.05;display:block;background:#333}
.card .pic svg{width:100%;height:100%}
.card .info{padding:10px 12px 14px;display:flex;flex-direction:column;gap:3px}
.card .name{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.card .price{font-size:17px;font-weight:700;margin-top:2px}
.card .seller{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tag{position:absolute;left:8px;top:8px;background:var(--blue);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px}
.tag.rep{background:#a24cf5}

.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.5}
.empty svg{margin:0 auto 14px;color:#555}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* tab bar */
.tabbar{display:flex;background:#101010;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;padding:4px 0}
.tab.on{color:var(--blue)}
.tab .badge{position:absolute;top:-4px;right:-10px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab .ic{position:relative}

/* profile */
.prof{display:flex;flex-direction:column;align-items:center;padding:36px 0 10px;gap:14px}
.avatar{width:110px;height:110px;border-radius:50%;overflow:hidden}
.nick{font-size:24px;font-weight:700}
.rows{background:var(--surface);border-radius:14px;margin-top:22px}
.row{display:flex;justify-content:space-between;padding:15px 16px;font-size:15px}
.row + .row{border-top:1px solid var(--line)}
.row span:first-child{color:var(--muted)}

/* detail */
.sheet{position:fixed;inset:0;z-index:20;display:none;justify-content:center;background:rgba(0,0,0,.6)}
.sheet.show{display:flex}
.sheet-in{width:100%;max-width:520px;height:100%;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-top{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.sh-top .balance{margin-left:auto}
.sh-body{flex:1;overflow-y:auto;padding:0 14px 16px}
.big{border-radius:16px;overflow:hidden;aspect-ratio:1/0.95;background:#333}
.big svg{width:100%;height:100%}
.d-price{font-size:30px;font-weight:800;margin-top:16px}
.d-name{font-size:20px;line-height:1.3;margin-top:4px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13px}
.chip.ok{color:var(--green)} .chip.warn{color:var(--yellow)}
.sec{font-size:17px;font-weight:700;margin:22px 0 8px}
.desc{line-height:1.5;color:#d0d0d0;font-size:15px}
.seller-box{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px;margin-top:22px}
.seller-box .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none}
.seller-box b{display:block;font-size:16px}
.seller-box small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px;margin-top:2px}
.stars{color:var(--yellow)}
.sh-foot{padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line);background:#101010}
.buy{width:100%;height:52px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.buy:active{background:var(--blue-d)}
.buy[disabled]{background:#3a3a3a;color:#888}
.foot-note{text-align:center;color:var(--red);font-size:13px;margin-bottom:8px;min-height:0}

/* onboarding */
.onb{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;justify-content:center}
.onb.show{display:flex}
.onb-in{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);position:relative}
.onb-step{flex:1;display:none;flex-direction:column;justify-content:center;gap:16px}
.onb-step.on{display:flex}
.onb h1{font-size:32px;line-height:1.15;letter-spacing:-.5px}
.onb p{color:#b5b5b5;font-size:17px;line-height:1.5}
.onb .logo-big{margin-bottom:10px}
.nickin{height:56px;border-radius:14px;background:var(--surface);border:2px solid transparent;padding:0 16px;font-size:18px;outline:0;width:100%}
.nickin:focus{border-color:var(--blue)}
.nickin.err{border-color:var(--red)}
.hint{font-size:14px;color:var(--muted);min-height:20px}
.hint.err{color:var(--red)}
.onb-foot{display:flex;align-items:center;justify-content:space-between;height:64px}
.dots{display:flex;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#444}
.dot.on{background:var(--blue);width:22px;border-radius:4px}
.next{width:64px;height:64px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff}
.next:active{background:var(--blue-d)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.chip.bad{color:var(--red)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.crow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.crow.br small{color:var(--red)}
.rbtn,.sbtn{background:var(--blue);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.sbtn.g{background:var(--surface);color:var(--text)}
.need{color:var(--yellow);font-size:13px;text-align:right;max-width:55%}
.okk{color:var(--green);font-weight:700}
.sellbox{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sellbox .nickin{background:var(--surface2)}
.rec b{display:block;font-size:22px;margin-top:2px}
.rec small{color:var(--muted);font-size:13px}
.est{font-size:14px;font-weight:600}.est.g{color:var(--green)}.est.y{color:var(--yellow)}.est.r{color:var(--red)}
.ad{display:flex;gap:12px;background:var(--surface);border-radius:14px;padding:10px;margin-bottom:12px}
.adp{width:96px;height:96px;border-radius:10px;overflow:hidden;flex:none}.adp svg{width:100%;height:100%}
.adi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.adi .name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adi .price{font-size:17px;font-weight:700}
.adt{font-size:13px;color:var(--muted)}
.bar{height:5px;background:#3a3a3a;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);width:0}
.cancel{align-self:flex-start;color:var(--red);font-size:14px;font-weight:600;padding:6px 0 0}
.btnrow{display:flex;gap:10px}
.prof .nickin{text-align:center}
.note{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%) translateY(-160%);width:min(94%,496px);background:#fff;color:#111;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.3,1);z-index:100}
.note.show{transform:translateX(-50%)}
.note .ni{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.note b{display:block;font-size:15px}.note span{font-size:13px;color:#555}
.rep{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center}
.rep.show{display:flex}
.rep-in{display:flex;flex-direction:column;align-items:center;gap:20px;width:76%;max-width:320px}
.rp-wrap{position:relative;width:150px;height:290px;animation:shk .45s ease-in-out infinite}
.rp-wrap .ph{filter:drop-shadow(0 0 18px rgba(0,170,255,.7));animation:glw 1s ease-in-out infinite alternate}
.scan{animation:scn 1.1s linear infinite}
.tool{position:absolute;right:-34px;top:70px;color:#fff;transform-origin:25% 80%;animation:wr .5s ease-in-out infinite alternate}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd24a;box-shadow:0 0 8px #ffd24a;opacity:0;animation:spk .9s ease-out infinite}
.chk{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--green)}
.rep.done .chk{display:flex;animation:pop .4s ease-out}
.rep.done .ph{filter:drop-shadow(0 0 30px rgba(4,224,97,.95));animation:none}
.rep.done .scan,.rep.done .tool,.rep.done .sp{display:none}
.rep.done .rp-wrap{animation:none}
.rp-t{font-size:17px;font-weight:600}
.rp-bar{width:100%;height:8px;background:#333;border-radius:4px;overflow:hidden}.rp-bar i{display:block;height:100%;width:0;background:var(--blue)}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
@keyframes glw{from{filter:drop-shadow(0 0 8px rgba(0,170,255,.4))}to{filter:drop-shadow(0 0 26px rgba(0,170,255,.95))}}
@keyframes scn{from{transform:translateY(0)}to{transform:translateY(250px)}}
@keyframes wr{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
@keyframes spk{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <div class="brand">
      <div id="logoSmall"></div>
      <span class="brand-name">Объявка</span>
    </div>
    <div class="balance">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor"/></svg>
      <span class="bal-val">0 ₽</span>
    </div>
  </div>

  <div class="searchwrap" id="searchWrap">
    <div class="search" id="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Телефоны, запчасти и другое" autocomplete="off">
      <button class="clear" id="clearQ" aria-label="Очистить">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <nav class="tabbar">
    <button class="tab on" data-tab="buy">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.2 12.2a1 1 0 0 1-1 1.1H5.8a1 1 0 0 1-1-1.1L6 7z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg></span>
      <span>Закупка</span>
    </button>
    <button class="tab" data-tab="shop">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5 5L3.5 17.5a2 2 0 0 0 2.8 2.8l6.2-6.2a4 4 0 0 0 5-5l-2.6 2.6-2.4-.6-.6-2.4 2.8-2.4z"/></svg></span>
      <span>Мастерская</span>
    </button>
    <button class="tab" data-tab="ads">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-8 8a2 2 0 0 1-2.800 0L3 12z"/><circle cx="8" cy="8" r="1.300" fill="currentColor"/></svg><b class="badge" id="adsBadge" style="display:none">0</b></span>
      <span>Объявления</span>
    </button>
    <button class="tab" data-tab="prof">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4 4-6 8-6s7.400 2 8 6"/></svg></span>
      <span>Профиль</span>
    </button>
  </nav>
</div>

<!-- detail -->
<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="sh-top">
      <button class="back" id="closeSheet" aria-label="Назад">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <div class="balance">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor"/></svg>
        <span class="bal-val">0 ₽</span>
      </div>
    </div>
    <div class="sh-body" id="shBody"></div>
    <div class="sh-foot">
      <div class="foot-note" id="footNote"></div>
      <button class="buy" id="buyBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.2 12.2a1 1 0 0 1-1 1.1H5.8a1 1 0 0 1-1-1.1L6 7z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>
        <span id="buyLabel">Купить</span>
      </button>
    </div>
  </div>
</div>

<!-- onboarding -->
<div class="onb" id="onb">
  <div class="onb-in">
    <div class="onb-step on" data-s="1">
      <div class="logo-big" id="logoBig"></div>
      <h1>Добро пожаловать в Объявку</h1>
      <p>Покупайте телефоны и запчасти по хорошей цене, чините их в своей мастерской и перепродавайте.</p>
    </div>
    <div class="onb-step" data-s="2">
      <h1>Как вас зовут?</h1>
      <p>Придумайте ник. Его будут видеть другие пользователи.</p>
      <input class="nickin" id="nickIn" type="text" maxlength="16" placeholder="Ваш ник" autocomplete="off" autocapitalize="off">
      <div class="hint" id="nickHint">От 2 до 16 символов</div>
    </div>
    <div class="onb-foot">
      <div class="dots"><span class="dot on"></span><span class="dot"></span></div>
      <button class="next" id="nextBtn" aria-label="Далее">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="note" id="note"></div>
<div class="rep" id="rep"><div class="rep-in">
  <div class="rp-wrap" id="rpWrap">
    <svg class="ph" viewBox="0 0 160 300" width="150" height="290"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0af" stop-opacity="0"/><stop offset=".5" stop-color="#0af" stop-opacity=".8"/><stop offset="1" stop-color="#0af" stop-opacity="0"/></linearGradient><clipPath id="sc"><rect x="22" y="14" width="116" height="272" rx="20"/></clipPath></defs>
      <rect x="10" y="4" width="140" height="292" rx="28" fill="#1c1c1e" stroke="#6a6a6e" stroke-width="3"/>
      <rect x="22" y="14" width="116" height="272" rx="20" fill="#0d2238"/>
      <g clip-path="url(#sc)"><rect class="scan" x="22" y="10" width="116" height="40" fill="url(#sg)"/></g>
      <rect x="60" y="22" width="40" height="12" rx="6" fill="#000"/>
      <rect x="38" y="80" width="84" height="10" rx="5" fill="rgba(255,255,255,.14)"/><rect x="38" y="104" width="60" height="10" rx="5" fill="rgba(255,255,255,.14)"/>
      <rect x="38" y="200" width="84" height="48" rx="12" fill="rgba(0,170,255,.25)"/>
    </svg>
    <svg class="tool" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.700 6.300a4 4 0 0 0-5 5L3.500 17.500a2 2 0 0 0 2.800 2.800l6.200-6.200a4 4 0 0 0 5-5l-2.600 2.600-2.400-.6-.6-2.400 2.800-2.400z"/></svg>
    <div class="chk"><svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.500 12.500l3 3 6-6.500"/></svg></div>
  </div>
  <div class="rp-t" id="rpT"></div>
  <div class="rp-bar"><i id="rpBar"></i></div>
</div></div>

<script>
(function(){
  /* ---------- storage + online ---------- */
  var KEY = 'obyavka_v2', DB = 'https://great-brawl-default-rtdb.firebaseio.com/obyavka';
  var state = { uid:'', nick:'', balance:5000, parts:{}, phones:[], init:0, t:0 };
  var dirty = true, net = 'sync';
  function norm(r){
    if(!r || typeof r!=='object') return;
    state.uid = r.uid || state.uid; state.nick = r.nick || '';
    state.balance = (typeof r.balance==='number') ? r.balance : 5000;
    state.parts = r.parts || {}; state.init = r.init || 0; state.t = r.t || 0;
    state.phones = (r.phones || []).filter(Boolean).map(function(p){ p.broken = p.broken || {}; return p; });
  }
  function load(){
    try{ norm(JSON.parse(localStorage.getItem(KEY))); }catch(e){}
    if(!state.uid) state.uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

        return '<div class="crow'+(br?' br':'')+'"><div><b>'+CN[c]+'</b><small>'+(br?'Сломан':'Исправен')+'</small></div>'
          +(!br ? '<span class="okk">OK</span>' : k ? '<button class="rbtn" data-fix="'+c+'">Починить</button>' : '<span class="need">Нужно: '+esc(needName(ph,c))+'</span>')+'</div>'; }).join('')
      +'<div class="sec">Продажа</div><div class="sellbox"><div class="rec"><small>Рекомендуемая цена</small><b>'+fmt(R)+'</b><small>выручка около '+(pr<0?'−':'+')+fmt(Math.abs(pr))+'</small></div>'
      +'<input class="nickin" id="priceIn" type="number" inputmode="numeric" value="'+R+'"><div class="est" id="est"></div></div>';
    $('#sheet').classList.add('show'); $('#shBody').scrollTop = 0;
    upSell();
  }
  function upSell(){
    if(mode!=='work' || !cur) return;
    var v = Math.round(+$('#priceIn').value) || 0, t = waitSec(cur, Math.max(v,1)), e = $('#est');
    e.textContent = 'Ожидание: ~'+fmtT(t)+(t>600 ? ' · придётся долго сидеть на сайте' : '');
    e.className = 'est '+(t<=45?'g':t<=600?'y':'r');
    setFoot('Выставить за '+fmt(v), v<100 || v>999999, '');
  }
  function closeSheet(){ $('#sheet').classList.remove('show'); cur = null; }
  function buy(){
    if(!cur || mode!=='buy') return;
    var it = cur;
    if(state.balance < it.price){ $('#footNote').textContent = 'Не хватает '+fmt(it.price-state.balance); return; }
    state.balance -= it.price;
    if(it.kind==='part'){ state.parts[it.pk] = (state.parts[it.pk]||0)+1; }
    else { state.phones.unshift({ id:'p'+Date.now().toString(36)+rnd(10,99), kind:'phone', title:it.title, platform:it.platform, V:it.V, req:it.req, broken:it.broken, invested:it.price, art:it.art, cond:it.cond }); }
    listings = listings.filter(function(x){ return x.id!==it.id; });
    save(); closeSheet(); render();
    notify('Покупка: '+it.title, 'Списано '+fmt(it.price)+(it.kind==='phone'?' · телефон в мастерской':' · компонент на складе'));
  }
  function sell(){
    if(!cur || mode!=='work') return;
    var ph = cur, v = Math.round(+$('#priceIn').value) || 0; if(v<100) return;
    var t = waitSec(ph,v); ph.ad = { price:v, left:t, total:t };
    save(); closeSheet(); tab = 'ads'; render();
    notify('Объявление размещено', ph.title+' · '+fmt(v)+' · ожидание ~'+fmtT(t));
  }

  /* ---------- ремонт ---------- */
  function makeSparks(){
    var w = $('#rpWrap'); $$('.sp',w).forEach(function(e){ w.removeChild(e); });
    for(var i=0;i<14;i++){ var sp = document.createElement('span'); sp.className='sp';
      sp.style.setProperty('--x',rnd(-90,90)+'px'); sp.style.setProperty('--y',rnd(-110,110)+'px');
      sp.style.left = rnd(30,70)+'%'; sp.style.top = rnd(25,75)+'%'; sp.style.animationDelay = (Math.random()*0.9)+'s'; w.appendChild(sp); }
  }
  function startRepair(c){
    if(busy || !cur) return;
    var ph = cur, k = findPart(ph,c); if(!k) return;
    busy = true;
    var ov = $('#rep'), bar = $('#rpBar'); ov.className = 'rep show'; $('#rpT').textContent = CN[c]+': замена…';
    bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth; bar.style.transition = 'width 4s linear'; bar.style.width = '100%';
    makeSparks();
    setTimeout(function(){
      state.parts[k]--; ph.invested += PP[c][ph.platform][parse(k).q]; ph.broken[c] = false; ph.cond = nb(ph) ? 'fix' : 'ok'; save();
      ov.classList.add('done'); $('#rpT').textContent = 'Готово';
      setTimeout(function(){ ov.className = 'rep'; busy = false; render(); if(cur===ph) openWork(ph.id); notify('Починено', CN[c]+' заменён · '+ph.title); }, 900);
    }, 4000);
  }

  /* ---------- уведомления ---------- */
  function notify(t,sub){
    var n = $('#note');
    n.innerHTML = '<div class="ni">'+ICON_TAG+'</div><div><b>'+esc(t)+'</b><span>'+esc(sub||'')+'</span></div>';
    n.classList.add('show'); clearTimeout(nq); nq = setTimeout(function(){ n.classList.remove('show'); }, 4200);
  }
  $('#note').addEventListener('click', function(){ this.classList.remove('show'); });

  /* ---------- таймер продаж (идёт, пока сайт открыт) ---------- */
  setInterval(function(){
    if(document.hidden) return;
    tk++;
    var sold = [];
    state.phones.forEach(function(p){ if(p.ad){ p.ad.left--; if(p.ad.left<=0) sold.push(p); } });
    sold.forEach(function(p){
      state.balance += p.ad.price;
      state.phones = state.phones.filter(function(x){ return x!==p; });
      notify('Ваш телефон купили', p.title+' · '+pick(NICKS)+' заплатил '+fmt(p.ad.price));
    });
    if(sold.length){ save(); render(); } else { if(tk%5===0) save(); upAds(); }
  }, 1000);
  setInterval(flush, 5000);
  document.addEventListener('visibilitychange', function(){ if(document.hidden){ save(); flush(); } });

  /* ---------- ник ---------- */
  function checkNick(v){
    return api('/nicks/'+nkey(v)).then(function(r){ return !r || r===state.uid; }).catch(function(){ return true; });
  }
  function claimNick(v,old){
    if(old && old.toLowerCase()!==v.toLowerCase()) api('/nicks/'+nkey(old),'DELETE').catch(function(){});
    api('/nicks/'+nkey(v),'PUT',state.uid).catch(function(){});
  }

  /* ---------- онбординг ---------- */
  var step = 1;
  function setStep(n){
    step = n;
    $$('.onb-step').forEach(function(e){ e.classList.toggle('on', Number(e.getAttribute('data-s'))===n); });
    $$('.dot').forEach(function(d,i){ d.classList.toggle('on', i===n-1); });
    if(n===2){ setTimeout(function(){ $('#nickIn').focus(); }, 150); }
  }
  function onbErr(m){ $('#nickIn').classList.add('err'); var h = $('#nickHint'); h.classList.add('err'); h.textContent = m; }
  function onNext(){
    if(step===1){ setStep(2); return; }
    var v = $('#nickIn').value.trim();
    if(v.length<2 || v.length>16){ onbErr('Ник должен быть от 2 до 16 символов'); return; }
    checkNick(v).then(function(ok){
      if(!ok){ onbErr('Этот ник уже занят'); return; }
      state.nick = v; claimNick(v,'');
      if(!state.init){
        state.init = 1; state.balance = 5000;
        state.phones = [{ id:'p0'+Date.now().toString(36), kind:'phone', title:'Samsung Galaxy A10, 2/32 ГБ', platform:'a', V:3500, req:10, broken:{battery:true,glass:true,'case':false}, invested:1500, cond:'fix', art:{bg:C.teal,body:0,cams:2,style:'round',tilt:-8,part:'screen'} }];
      }
      save(); $('#onb').classList.remove('show'); start(); flush();
    });
  }
  function start(){
    genListings(); tab = 'buy'; query = ''; editNick = false;
    $('#q').value = ''; $('#search').classList.remove('has');
    render();
  }

  /* ---------- события ---------- */
  $('#logoSmall').innerHTML = logoSVG(34);
  $('#logoBig').innerHTML = logoSVG(96);
  $('#content').addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('[data-id],[data-w],[data-cancel],[data-act]') : null; if(!t) return;
    if(t.hasAttribute('data-id')) return openMarket(t.getAttribute('data-id'));
    if(t.hasAttribute('data-w')) return openWork(t.getAttribute('data-w'));
    if(t.hasAttribute('data-cancel')){
      var id = t.getAttribute('data-cancel'), ph = state.phones.filter(function(x){ return x.id===id; })[0];
      if(ph){ delete ph.ad; save(); render(); notify('Объявление снято','Телефон вернулся в мастерскую'); }
      return;
    }
    var a = t.getAttribute('data-act');
    if(a==='editnick'){ editNick = true; render(); }
    else if(a==='cancelnick'){ editNick = false; render(); }
    else if(a==='savenick'){
      var v = $('#nickEd').value.trim(), h = $('#edHint');
      if(v.length<2 || v.length>16){ h.className = 'hint err'; h.textContent = 'Ник должен быть от 2 до 16 символов'; return; }
      if(v===state.nick){ editNick = false; render(); return; }
      checkNick(v).then(function(ok){
        if(!ok){ h.className = 'hint err'; h.textContent = 'Этот ник уже занят'; return; }
        claimNick(v,state.nick); state.nick = v; editNick = false; save(); flush(); render(); notify('Ник изменён','Теперь вы: '+v);
      });
    }
  });
  $('#shBody').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-fix]') : null; if(b) startRepair(b.getAttribute('data-fix'));
  });
  $('#shBody').addEventListener('input', function(e){ if(e.target.id==='priceIn') upSell(); });
  $$('.tab').forEach(function(t){ t.addEventListener('click', function(){ tab = t.getAttribute('data-tab'); editNick = false; render(); }); });
  $('#closeSheet').addEventListener('click', function(){ if(!busy) closeSheet(); });
  $('#sheet').addEventListener('click', function(e){ if(e.target===this && !busy) closeSheet(); });
  $('#buyBtn').addEventListener('click', function(){ if(mode==='buy') buy(); else sell(); });
  $('#nextBtn').addEventListener('click', onNext);
  $('#nickIn').addEventListener('input', function(){
    this.classList.remove('err'); var h = $('#nickHint'); h.classList.remove('err'); h.textContent = 'От 2 до 16 символов';
  });
  $('#nickIn').addEventListener('keydown', function(e){ if(e.key==='Enter'){ onNext(); } });
  $('#q').addEventListener('input', function(){ query = this.value; $('#search').classList.toggle('has', !!query); render(); });
  $('#clearQ').addEventListener('click', function(){ $('#q').value=''; query=''; $('#search').classList.remove('has'); render(); });

  /* ---------- запуск ---------- */
  load();
  if(state.nick){ start(); } else { $('#onb').classList.add('show'); setStep(1); updateBalance(); }
  api('/users/'+state.uid).then(function(r){
    if(r && r.nick && (r.t||0) > state.t){ norm(r); try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} dirty = false; $('#onb').classList.remove('show'); start(); }
    net = 'on'; netText();
  }).catch(function(){ net = 'off'; netText(); });
})();
</script>
</body>
      </html>
