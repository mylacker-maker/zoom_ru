<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Объявка</title>
<style>
:root{
  --bg:#0b0b0b; --surface:#262626; --surface2:#1c1c1c; --line:#333;
  --text:#f2f2f2; --muted:#8c8c8c; --blue:#0af; --blue-d:#0088cc;
  --green:#04e061; --red:#ff4d4f; --yellow:#ffb400;
  --c-teal:#a0e4d4; --c-orange:#fda57d; --c-green:#a3b88f; --c-purple:#c8a5cb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}

/* top bar */
.top{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand-name{font-size:21px;font-weight:700;letter-spacing:-.3px}
.balance{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:18px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.balance svg{color:var(--blue)}

.searchwrap{padding:4px 14px 10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;height:48px}
.search svg{color:var(--muted);flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--muted)}
.clear{display:none;color:var(--muted)}
.search.has .clear{display:block}

/* content */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 20px;-webkit-overflow-scrolling:touch}
.title{font-size:22px;font-weight:700;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative}
button.card:active{transform:scale(.98)}
.card .pic{width:100%;aspect-ratio:1/1.05;display:block;background:#333}
.card .pic svg{width:100%;height:100%}
.card .info{padding:10px 12px 14px;display:flex;flex-direction:column;gap:3px}
.card .name{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.card .price{font-size:17px;font-weight:700;margin-top:2px}
.card .seller{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tag{position:absolute;left:8px;top:8px;background:var(--blue);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px}
.tag.rep{background:#a24cf5}

.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.5}
.empty svg{margin:0 auto 14px;color:#555}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* tab bar */
.tabbar{display:flex;background:#101010;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;padding:4px 0}
.tab.on{color:var(--blue)}
.tab .badge{position:absolute;top:-4px;right:-10px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab .ic{position:relative}

/* profile */
.prof{display:flex;flex-direction:column;align-items:center;padding:36px 0 10px;gap:14px}
.avatar{width:110px;height:110px;border-radius:50%;overflow:hidden}
.nick{font-size:24px;font-weight:700}
.rows{background:var(--surface);border-radius:14px;margin-top:22px}
.row{display:flex;justify-content:space-between;padding:15px 16px;font-size:15px}
.row + .row{border-top:1px solid var(--line)}
.row span:first-child{color:var(--muted)}

/* detail */
.sheet{position:fixed;inset:0;z-index:20;display:none;justify-content:center;background:rgba(0,0,0,.6)}
.sheet.show{display:flex}
.sheet-in{width:100%;max-width:520px;height:100%;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.content.sl-r{animation:slr .26s ease-out}
.content.sl-l{animation:sll .26s ease-out}
@keyframes slr{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes sll{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
.sh-top{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.sh-top .balance{margin-left:auto}
.sh-body{flex:1;overflow-y:auto;padding:0 14px 16px}
.big{border-radius:16px;overflow:hidden;aspect-ratio:1/0.95;background:#333}
.big svg{width:100%;height:100%}
.d-price{font-size:30px;font-weight:800;margin-top:16px}
.d-name{font-size:20px;line-height:1.3;margin-top:4px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13px}
.chip.ok{color:var(--green)} .chip.warn{color:var(--yellow)}
.sec{font-size:17px;font-weight:700;margin:22px 0 8px}
.desc{line-height:1.5;color:#d0d0d0;font-size:15px}
.seller-box{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px;margin-top:22px}
.seller-box .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none}
.seller-box b{display:block;font-size:16px}
.seller-box small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px;margin-top:2px}
.stars{color:var(--yellow)}
.sh-foot{padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line);background:#101010}
.buy{width:100%;height:52px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.buy:active{background:var(--blue-d)}
.buy[disabled]{background:#3a3a3a;color:#888}
.foot-note{text-align:center;color:var(--red);font-size:13px;margin-bottom:8px;min-height:0}

/* onboarding */
.onb{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;justify-content:center}
.onb.show{display:flex}
.onb-in{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);position:relative}
.onb-step{flex:1;display:none;flex-direction:column;justify-content:center;gap:16px}
.onb-step.on{display:flex}
.onb h1{font-size:32px;line-height:1.15;letter-spacing:-.5px}
.onb p{color:#b5b5b5;font-size:17px;line-height:1.5}
.onb .logo-big{margin-bottom:10px}
.nickin{height:56px;border-radius:14px;background:var(--surface);border:2px solid transparent;padding:0 16px;font-size:18px;outline:0;width:100%}
.nickin:focus{border-color:var(--blue)}
.nickin.err{border-color:var(--red)}
.hint{font-size:14px;color:var(--muted);min-height:20px}
.hint.err{color:var(--red)}
.onb-foot{display:flex;align-items:center;justify-content:space-between;height:64px}
.dots{display:flex;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#444}
.dot.on{background:var(--blue);width:22px;border-radius:4px}
.next{width:64px;height:64px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff}
.next:active{background:var(--blue-d)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.chip.bad{color:var(--red)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.crow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.crow.br small{color:var(--red)}
.rbtn,.sbtn{background:var(--blue);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.sbtn.g{background:var(--surface);color:var(--text)}
.need{color:var(--yellow);font-size:13px;text-align:right;max-width:55%}
.okk{color:var(--green);font-weight:700}
.sellbox{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sellbox .nickin{background:var(--surface2)}
.rec b{display:block;font-size:22px;margin-top:2px}
.rec small{color:var(--muted);font-size:13px}
.est{font-size:14px;font-weight:600}.est.g{color:var(--green)}.est.y{color:var(--yellow)}.est.r{color:var(--red)}
.ad{display:flex;gap:12px;background:var(--surface);border-radius:14px;padding:10px;margin-bottom:12px}
.adp{width:96px;height:96px;border-radius:10px;overflow:hidden;flex:none}.adp svg{width:100%;height:100%}
.adi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.adi .name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adi .price{font-size:17px;font-weight:700}
.adt{font-size:13px;color:var(--muted)}
.bar{height:5px;background:#3a3a3a;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);width:0}
.cancel{align-self:flex-start;color:var(--red);font-size:14px;font-weight:600;padding:6px 0 0}
.btnrow{display:flex;gap:10px}
.prof .nickin{text-align:center}
.note{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%) translateY(-160%);width:min(94%,496px);background:#fff;color:#111;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.3,1);z-index:100}
.note.show{transform:translateX(-50%)}
.note .ni{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.note b{display:block;font-size:15px}.note span{font-size:13px;color:#555}
.rep{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center}
.rep.show{display:flex}
.rep-in{display:flex;flex-direction:column;align-items:center;gap:20px;width:76%;max-width:320px}
.rp-wrap{position:relative;width:150px;height:290px;animation:shk .45s ease-in-out infinite}
.rp-wrap .ph{filter:drop-shadow(0 0 18px rgba(0,170,255,.7));animation:glw 1s ease-in-out infinite alternate}
.scan{animation:scn 1.1s linear infinite}
.tool{position:absolute;right:-34px;top:70px;color:#fff;transform-origin:25% 80%;animation:wr .5s ease-in-out infinite alternate}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd24a;box-shadow:0 0 8px #ffd24a;opacity:0;animation:spk .9s ease-out infinite}
.chk{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--green)}
.rep.done .chk{display:flex;animation:pop .4s ease-out}
.rep.done .ph{filter:drop-shadow(0 0 30px rgba(4,224,97,.95));animation:none}
.rep.done .scan,.rep.done .tool,.rep.done .sp{display:none}
.rep.done .rp-wrap{animation:none}
.rp-t{font-size:17px;font-weight:600}
.rp-bar{width:100%;height:8px;background:#333;border-radius:4px;overflow:hidden}.rp-bar i{display:block;height:100%;width:0;background:var(--blue)}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
@keyframes glw{from{filter:drop-shadow(0 0 8px rgba(0,170,255,.4))}to{filter:drop-shadow(0 0 26px rgba(0,170,255,.95))}}
@keyframes scn{from{transform:translateY(0)}to{transform:translateY(250px)}}
@keyframes wr{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
@keyframes spk{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

.cs{position:fixed;inset:0;z-index:95;background:#0b0d12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.cs.show{display:flex}
.cs-t{font-size:20px;font-weight:700}
.cs-view{position:relative;width:100%;max-width:560px;height:172px;overflow:hidden;background:#12151d;border-top:1px solid #222;border-bottom:1px solid #222}
.cs-view:before,.cs-view:after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none}
.cs-view:before{left:0;background:linear-gradient(90deg,#0b0d12,transparent)}
.cs-view:after{right:0;background:linear-gradient(270deg,#0b0d12,transparent)}
.cs-line{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#ffcc00;z-index:3;box-shadow:0 0 12px #ffcc00}
.cs-line:before{content:"";position:absolute;top:0;left:-8px;border:9px solid transparent;border-top:10px solid #ffcc00;border-bottom:0}
.cs-strip{display:flex;height:100%;padding:11px 0;will-change:transform}
.cs-tile{flex:none;width:128px;margin-right:8px;height:150px;border-radius:8px;border-bottom:4px solid var(--rc);overflow:hidden;display:flex;flex-direction:column}
.cs-tile .tp{flex:1;min-height:0}.cs-tile .tp svg{width:100%;height:100%}
.cs-tile .tn{font-size:11px;padding:4px 6px;text-align:center;line-height:1.2;height:32px;overflow:hidden;color:#ddd;background:#1b1f2a}
.cs-tile.win{outline:2px solid var(--rc);outline-offset:-2px}
.cs-res{min-height:56px;text-align:center;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:18px}
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <div class="brand">
      <div id="logoSmall"></div>
      <span class="brand-name">Объявка</span>
    </div>
    <div class="balance">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor"/></svg>
      <span class="bal-val">0 ₽</span>
    </div>
  </div>

  <div class="searchwrap" id="searchWrap">
    <div class="search" id="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Телефоны, запчасти и другое" autocomplete="off">
      <button class="clear" id="clearQ" aria-label="Очистить">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <nav class="tabbar">
    <button class="tab on" data-tab="buy">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.2 12.2a1 1 0 0 1-1 1.1H5.8a1 1 0 0 1-1-1.1L6 7z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg></span>
      <span>Закупка</span>
    </button>
    <button class="tab" data-tab="ali">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg></span>
      <span>Алиэкспресс</span>
    </button>
    <button class="tab" data-tab="shop">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5 5L3.5 17.5a2 2 0 0 0 2.8 2.8l6.2-6.2a4 4 0 0 0 5-5l-2.6 2.6-2.4-.6-.6-2.4 2.8-2.4z"/></svg></span>
      <span>Инвентарь</span>
    </button>
    <button class="tab" data-tab="ads">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-8 8a2 2 0 0 1-2.800 0L3 12z"/><circle cx="8" cy="8" r="1.300" fill="currentColor"/></svg><b class="badge" id="adsBadge" style="display:none">0</b></span>
      <span>Объявления</span>
    </button>
    <button class="tab" data-tab="prof">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4 4-6 8-6s7.400 2 8 6"/></svg></span>
      <span>Профиль</span>
    </button>
  </nav>
</div>

<!-- detail -->
<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="sh-top">
      <button class="back" id="closeSheet" aria-label="Назад">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <div class="balance">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor"/></svg>
        <span class="bal-val">0 ₽</span>
      </div>
    </div>
    <div class="sh-body" id="shBody"></div>
    <div class="sh-foot">
      <div class="foot-note" id="footNote"></div>
      <button class="buy" id="buyBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.2 12.2a1 1 0 0 1-1 1.1H5.8a1 1 0 0 1-1-1.1L6 7z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>
        <span id="buyLabel">Купить</span>
      </button>
    </div>
  </div>
</div>

<!-- onboarding -->
<div class="onb" id="onb">
  <div class="onb-in">
    <div class="onb-step on" data-s="1">
      <div class="logo-big" id="logoBig"></div>
      <h1>Объявка</h1>
      
    </div>
    <div class="onb-step" data-s="2">
      <h1>Вход</h1>
      <input class="nickin" id="nickIn" type="text" maxlength="16" placeholder="Ваш ник" autocomplete="off" autocapitalize="off">
      <input class="nickin" id="pwIn" type="password" maxlength="32" placeholder="Пароль (от 4 символов)" autocomplete="off"><div class="hint" id="nickHint">От 2 до 16 символов</div>
    </div>
    <div class="onb-foot">
      <div class="dots"><span class="dot on"></span><span class="dot"></span></div>
      <button class="next" id="nextBtn" aria-label="Далее">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="note" id="note"></div>
<div class="cs" id="cs"><div class="cs-t" id="csT"></div><div class="cs-view" id="csView"><div class="cs-line"></div><div class="cs-strip" id="csStrip"></div></div><div class="cs-res" id="csRes"></div><button class="buy" id="csOk" style="width:calc(100% - 28px);max-width:360px;visibility:hidden">Забрать</button></div>
<div class="rep" id="rep"><div class="rep-in">
  <div class="rp-wrap" id="rpWrap">
    <svg class="ph" viewBox="0 0 160 300" width="150" height="290"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0af" stop-opacity="0"/><stop offset=".5" stop-color="#0af" stop-opacity=".8"/><stop offset="1" stop-color="#0af" stop-opacity="0"/></linearGradient><clipPath id="sc"><rect x="22" y="14" width="116" height="272" rx="20"/></clipPath></defs>
      <rect x="10" y="4" width="140" height="292" rx="28" fill="#1c1c1e" stroke="#6a6a6e" stroke-width="3"/>
      <rect x="22" y="14" width="116" height="272" rx="20" fill="#0d2238"/>
      <g clip-path="url(#sc)"><rect class="scan" x="22" y="10" width="116" height="40" fill="url(#sg)"/></g>
      <rect x="60" y="22" width="40" height="12" rx="6" fill="#000"/>
      <rect x="38" y="80" width="84" height="10" rx="5" fill="rgba(255,255,255,.14)"/><rect x="38" y="104" width="60" height="10" rx="5" fill="rgba(255,255,255,.14)"/>
      <rect x="38" y="200" width="84" height="48" rx="12" fill="rgba(0,170,255,.25)"/>
    </svg>
    <svg class="tool" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.700 6.300a4 4 0 0 0-5 5L3.500 17.500a2 2 0 0 0 2.800 2.800l6.200-6.200a4 4 0 0 0 5-5l-2.600 2.600-2.400-.6-.6-2.400 2.800-2.400z"/></svg>
    <div class="chk"><svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.500 12.500l3 3 6-6.500"/></svg></div>
  </div>

</div></div>

<script>
(function(){
  /* ---------- storage + online ---------- */
  var KEY = 'obyavka_v2', DB = 'https://great-brawl-default-rtdb.firebaseio.com/obyavka';
  var state = { uid:'', nick:'', balance:5000, parts:{}, phones:[], cases:{}, init:0, t:0 };
  var dirty = true, net = 'sync';
  function norm(r){
    if(!r || typeof r!=='object') return;
    state.uid = r.uid || state.uid; state.nick = r.nick || '';
    state.balance = (typeof r.balance==='number') ? r.balance : 5000;
    state.parts = r.parts || {}; state.cases = r.cases || {}; state.init = r.init || 0; state.t = r.t || 0; state.h = r.h || state.h || ''; state.reg = r.reg || state.reg || 0;
    state.phones = (r.phones || []).filter(Boolean).map(function(p){ p.broken = p.broken || {}; return p; });
  }
  function load(){
    try{ norm(JSON.parse(localStorage.getItem(KEY))); }catch(e){}
    if(!state.uid) state.uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
  var ftm = null, flying = false, ferr = '';
  function save(){ state.t = Date.now(); dirty = true; try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} clearTimeout(ftm); ftm = setTimeout(function(){ flush(); }, 700); }
  function api(path, method, body, ka){
    var c = window.AbortController ? new AbortController() : null;
    var tm = setTimeout(function(){ if(c) c.abort(); }, 8000);
    var data = body===undefined ? undefined : JSON.stringify(body);
    return fetch(DB + path + '.json', { method:method||'GET', body:data, signal:c?c.signal:undefined, keepalive:!!ka && !!data && data.length<60000 })
      .then(function(r){ clearTimeout(tm); if(!r.ok) throw { code:r.status }; return r.json(); });
  }
  function netText(){ var e = document.getElementById('netv'); if(e) e.textContent = net==='on'?'Онлайн':net==='off'?'Нет связи'+(ferr?' ('+ferr+')':''):'Синхронизация…'; }
  function flush(ka){
    if(!dirty || !state.nick || !state.reg || flying) return;
    dirty = false; flying = true; net = 'sync'; netText();
    var snap; try{ snap = JSON.parse(JSON.stringify(pub())); }catch(e){ snap = pub(); }
    api('/users/' + state.uid, 'PUT', snap, ka===true)
      .then(function(){ net = 'on'; ferr = ''; })
      .catch(function(e){ net = 'off'; ferr = (e && e.code) ? String(e.code) : 'сеть'; dirty = true; })
      .then(function(){ flying = false; netText(); if(dirty && net==='on') setTimeout(flush, 300); });
  }
  function pub(){ var o = {}; for(var k in state){ if(k!=='h') o[k] = state[k]; } return o; }
  function nkey(n){ return encodeURIComponent(n.toLowerCase().replace(/[.$#\[\]\/]/g,'_')); }

  /* ---------- helpers ---------- */
  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0') + '\u00A0₽'; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var C = { teal:'#a0e4d4', orange:'#fda57d', green:'#a3b88f', purple:'#c8a5cb' };

  /* ---------- logo (только кружки) ---------- */
  function logoSVG(size){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true">'
      +'<circle cx="30" cy="31" r="25" fill="'+C.teal+'"/>'
      +'<circle cx="77" cy="26" r="19" fill="'+C.orange+'"/>'
      +'<circle cx="68" cy="71" r="27" fill="'+C.green+'"/>'
      +'<circle cx="19" cy="80" r="17" fill="'+C.purple+'"/>'
      +'</svg>';
  }

  function avatarSVG(name){
    var ch = (name||'?').trim().charAt(0).toUpperCase() || '?';
    var h = 0; for(var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i))>>>0; }
    var cols = [C.teal,C.orange,C.green,C.purple];
    var a = cols[h%4], b = cols[(h>>2)%4], c = cols[(h>>4)%4];
    return '<svg viewBox="0 0 100 100" width="100%" height="100%">'
      +'<rect width="100" height="100" fill="'+a+'"/>'
      +'<circle cx="82" cy="20" r="26" fill="'+b+'"/>'
      +'<circle cx="16" cy="92" r="30" fill="'+c+'"/>'
      +'<text x="50" y="66" text-anchor="middle" font-size="46" font-weight="700" fill="#1a1a1a" font-family="Arial,sans-serif">'+esc(ch)+'</text>'
      +'</svg>';
  }

  /* ---------- данные ---------- */
  var PH = [['Samsung Galaxy A10, 2/32 ГБ',3500,'a'],['Redmi 9A, 2/32 ГБ',4000,'a'],['Samsung Galaxy A20, 3/32 ГБ',4500,'a'],['Tecno Spark 10, 8/128 ГБ',5800,'a'],['Huawei P30 Lite, 4/128 ГБ',6200,'a'],['Infinix Hot 30, 8/128 ГБ',6500,'a'],['realme C55, 8/256 ГБ',8000,'a'],['Redmi Note 11, 4/128 ГБ',8500,'a'],['Samsung Galaxy A52, 6/128 ГБ',13000,'a'],['POCO X5 Pro, 8/256 ГБ',14000,'a'],['Google Pixel 6, 8/128 ГБ',16500,'a'],['Samsung Galaxy S21, 8/128 ГБ',21000,'a'],['Xiaomi 12T, 8/256 ГБ',24000,'a'],
    ['iPhone 7, 32 ГБ',6000,'i'],['iPhone 8, 64 ГБ',8000,'i'],['iPhone XR, 64 ГБ',9500,'i'],['iPhone 11, 64 ГБ',14500,'i'],['iPhone 12, 128 ГБ',22500,'i'],['iPhone 13, 128 ГБ',31000,'i']];
  var CN = { battery:'Аккумулятор', glass:'Стекло', 'case':'Корпус' };
  var PP = { battery:{a:{0:600},i:{0:950}}, glass:{a:{10:500,15:1100},i:{10:800,15:1600,20:2800}}, 'case':{a:{10:400,15:900},i:{10:600,15:1300,20:2400}} };
  var COMPS = ['battery','glass','case'];
  var CASES = {
    bum:   { name:'Кейс «Бомжа»',        price:5000,  bg:C.orange, q:10 },
    lord:  { name:'Кейс «Лорда»',        price:14000, bg:C.purple, q:15 },
    iphone:{ name:'Кейс «iPhone»',       price:10500, bg:C.teal },
    parts: { name:'Кейс с запчастями',   price:2000,  bg:C.green }
  };
  function caseModels(ct){ return PH.filter(function(m){ return ct==='iphone' ? m[2]==='i' : (m[2]==='a' && reqQ('a',m[1])===CASES[ct].q); }); }
  function rar(v,part){
    var t = part ? [700,1200,2000] : [5000,9000,15000,25000];
    var cols = part ? ['#8c8c8c','#4b8bff','#a24cf5','#e63fb8'] : ['#8c8c8c','#4b8bff','#a24cf5','#e63fb8','#ff4d4f'];
    var i = 0; while(i<t.length && v>=t[i]) i++; return cols[i];
  }
  function casePool(ct){
    var out = [];
    if(ct==='parts'){
      COMPS.forEach(function(c){ ['a','i'].forEach(function(pl){ Object.keys(PP[c][pl]).forEach(function(q){
        var v = PP[c][pl][q];
        out.push({ kind:'part', c:c, p:pl, q:+q, name:pname(c,pl,+q), val:v, rc:rar(v,true), look:{bg:pick(PAL),tilt:rnd(-10,10),part:c==='glass'?'screen':c==='case'?'board':'battery'} });
      }); }); });
    } else {
      caseModels(ct).forEach(function(m){
        out.push({ kind:'phone', m:m, name:m[0], val:m[1], rc:rar(m[1]), look:{bg:pick(PAL),body:rnd(0,BODY.length-1),cams:rnd(1,4),style:pick(['round','bar','dual']),tilt:rnd(-10,10),part:'screen'} });
      });
    }
    var base = Math.min.apply(null, out.map(function(x){ return x.val; })), tot = 0;
    out.forEach(function(x){ x.w = Math.pow(base/x.val,2)*100; tot += x.w; });
    out.forEach(function(x){ x.ch = x.w/tot*100; });
    return out;
  }
  function wpick(pool){
    var t = 0; pool.forEach(function(x){ t += x.w; });
    var r = Math.random()*t;
    for(var i=0;i<pool.length;i++){ r -= pool[i].w; if(r<=0) return pool[i]; }
    return pool[pool.length-1];
  }
  function caseContentsHTML(ct){
    var rows = casePool(ct).sort(function(a,b){ return b.val-a.val; }).map(function(x){
      return '<div class="crow" style="border-left:4px solid '+x.rc+'"><b>'+esc(x.name)+'</b><span>'+(x.ch<1?x.ch.toFixed(2):x.ch.toFixed(1))+'%</span></div>';
    }).join('');
    return '<div class="sec">Содержимое'+(ct==='parts'?' (2 шт.)':'')+'</div>' + rows;
  }
  var NICKS = ['Lacker','tech_fox','mobilmaster','Vitalya72','sima_phone','GadgetDen','korobka','nikolay_s','RemontPro','alinka_shop','byte_trader','Tobol_tel','SwapMan','yarik_mob','gl1tch','ms_phones'];
  var PAL = [C.teal,C.orange,C.green,C.purple,'#e9c46a','#8ecae6'];
  var BODY = [['#1f1f1f','#2c2c2c'],['#d8c9b0','#c9b898'],['#e6e6e6','#cfcfcf'],['#2b3a55','#3a4b6b'],['#cbd5c0','#b4c2a6'],['#3b2f3f','#4c3d52']];
  var CONDS = { ok:{label:'Рабочий',cls:'ok'}, fix:{label:'Требует ремонта',cls:'warn'} };
  var MM = [1,0.8,0.62,0.45];

  function pkey(c,p,q){ return c+':'+p+':'+q; }
  function pname(c,p,q){ return (c==='glass'?'Новое стекло ':c==='case'?'Корпус ':'Аккумулятор ')+(p==='i'?'iPhone':'Android')+(q?' '+q:''); }
  function parse(k){ var x = k.split(':'); return {c:x[0],p:x[1],q:+x[2]}; }
  function reqQ(p,V){ return V<10000 ? 10 : (p==='a' || V<25000) ? 15 : 20; }
  function nb(ph){ return COMPS.filter(function(c){ return ph.broken[c]; }).length; }
  function recPrice(ph){ var cap = ph.free ? ph.V : ph.invested+500; return Math.max(100, Math.round(Math.min(cap, ph.V*MM[nb(ph)])/50)*50); }
  function waitSec(ph,price){
    var r = price / recPrice(ph), b = nb(ph), t;
    if(r<=1) t = 10 + 10*Math.max(0,(r-0.6)/0.4) + 4*b;
    else t = 20 + 4*b + (880+900*b)*Math.pow(r-1,1.5);
    return Math.round(t);
  }
  function fmtT(t){ if(t<60) return t+' сек'; if(t<3600) return Math.round(t/60)+' мин'; if(t<86400){ var h = Math.floor(t/3600), m = Math.round(t%3600/60); return h+' ч'+(m?' '+m+' мин':''); } return Math.round(t/86400)+' сут'; }
  function clk(l){ var h = Math.floor(l/3600), m = Math.floor(l%3600/60), x = l%60; return (h ? h+':'+('0'+m).slice(-2) : m)+':'+('0'+x).slice(-2); }
  function findPart(ph,c){
    var p = ph.platform;
    if(c==='battery'){ var k = pkey(c,p,0); return state.parts[k]>0 ? k : null; }
    var qs = Object.keys(PP[c][p]).map(Number).sort(function(x,y){ return x-y; });
    for(var i=0;i<qs.length;i++){ if(qs[i]>=ph.req){ var k2 = pkey(c,p,qs[i]); if(state.parts[k2]>0) return k2; } }
    return null;
  }
  function needName(ph,c){ return pname(c, ph.platform, c==='battery'?0:ph.req); }

  function makeItem(i){
    var it = { id:'i'+Date.now().toString(36)+i+rnd(100,999), seller:pick(NICKS), rating:(4+Math.random()).toFixed(1), reviews:rnd(3,640), delivery:rnd(1,4) };
    if(Math.random()<0.04){ var ct = pick(Object.keys(CASES)); it.kind = 'case'; it.ct = ct; it.title = CASES[ct].name; it.price = Math.round(CASES[ct].price*(0.90+Math.random()*0.07)); it.cond = 'ok'; it.art = {bg:CASES[ct].bg,part:'case'}; return it; }
    if(Math.random()<0.4){
      var c = pick(['battery','glass','glass','case','case']), p = pick(['a','i']), q = +pick(Object.keys(PP[c][p]));
      it.kind='part'; it.pk=pkey(c,p,q); it.q=q; it.platform=p; it.title=pname(c,p,q); it.cond='ok';
      it.price = Math.round(PP[c][p][q]*(0.9+Math.random()*0.25)/10)*10;
      it.art = {bg:pick(PAL),body:0,cams:1,style:'round',tilt:rnd(-10,10),part:c==='glass'?'screen':c==='case'?'board':'battery'};
      return it;
    }
    var m = pick(PH), b = pick([0,1,1,1,2,2,2,3,3]), cs = COMPS.slice().sort(function(){ return Math.random()-.5; });
    it.kind='phone'; it.title=m[0]; it.platform=m[2]; it.V=m[1]; it.req=reqQ(m[2],m[1]); it.broken={battery:false,glass:false,'case':false};
    for(var k=0;k<b;k++) it.broken[cs[k]] = true;
    it.cond = b ? 'fix' : 'ok';
    it.price = Math.max(150, Math.round(m[1]*[0.92,0.72,0.55,0.38][b]*(0.92+Math.random()*0.2)/50)*50);
    if(Math.random()<0.08){ it.secret = true; it.cond = 'ok'; it.price = Math.max(100, Math.round(it.price*(0.7+Math.random()*0.25)/50)*50); }
    it.art = {bg:pick(PAL),body:rnd(0,BODY.length-1),cams:rnd(1,4),style:pick(['round','bar','dual']),tilt:rnd(-14,14),part:'screen'};
    return it;
  }

  /* ---------- иллюстрации ---------- */
  function lens(cx,cy,r){
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#161616" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.55)+'" fill="#26427a"/>'
      +'<circle cx="'+(cx-r*0.2)+'" cy="'+(cy-r*0.2)+'" r="'+(r*0.18)+'" fill="rgba(255,255,255,.7)"/>';
  }
  function art(it){
    var a = it.art, w = 200, h = 210;
    var s = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect width="'+w+'" height="'+h+'" fill="'+a.bg+'"/>';
    s += '<circle cx="'+(a.tilt>0?170:30)+'" cy="30" r="46" fill="rgba(255,255,255,.18)"/>';
    s += '<circle cx="'+(a.tilt>0?40:165)+'" cy="195" r="58" fill="rgba(0,0,0,.08)"/>';
    s += '<g transform="rotate('+a.tilt+' 100 105)">';
    if(it.kind==='phone'){
      var bc = BODY[a.body];
      s += '<rect x="58" y="22" width="84" height="166" rx="14" fill="'+bc[0]+'"/>';
      s += '<path d="M58 70 L142 52 L142 120 L58 150 Z" fill="'+bc[1]+'" opacity=".55"/>';
      if(a.style==='round'){
        s += '<circle cx="100" cy="64" r="26" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.2)"/>';
        var pts = a.cams===1?[[100,64]]:a.cams===2?[[91,64],[109,64]]:a.cams===3?[[100,52],[89,72],[111,72]]:[[90,54],[110,54],[90,74],[110,74]];
        pts.forEach(function(p){ s += lens(p[0],p[1],a.cams>2?7.5:9); });
      } else if(a.style==='bar'){
        s += '<rect x="68" y="32" width="24" height="'+(10+a.cams*17)+'" rx="12" fill="rgba(0,0,0,.4)"/>';
        for(var k=0;k<a.cams;k++){ s += lens(80,44+k*17,7); }
      } else {
        s += '<rect x="68" y="32" width="38" height="22" rx="11" fill="rgba(0,0,0,.4)"/>';
        s += lens(79,43,7)+lens(95,43,7);
        s += '<circle cx="124" cy="40" r="3" fill="#ffd966"/>';
      }
      if(it.cond==='fix' || it.cond==='junk'){
        s += '<g stroke="rgba(255,255,255,.8)" stroke-width="1.4" fill="none" stroke-linecap="round"><path d="M142 120 L118 132 L110 160 L96 170"/><path d="M118 132 L132 150"/><path d="M110 160 L124 182"/><path d="M118 132 L100 128 L88 140"/></g>';
      }
    } else if(it.kind==='case'){
      s += '<rect x="45" y="52" width="110" height="100" rx="10" fill="#c9a24a"/>';
      s += '<rect x="45" y="52" width="110" height="28" rx="10" fill="#b08a2e"/>';
      s += '<rect x="91" y="52" width="18" height="100" fill="#8a6d1f"/>';
      s += '<text x="100" y="130" text-anchor="middle" font-size="42" font-weight="700" fill="#3a2c07" font-family="Arial,sans-serif">?</text>';
    } else if(a.part==='screen'){
      s += '<rect x="56" y="24" width="88" height="162" rx="12" fill="#111"/>';
      s += '<rect x="63" y="32" width="74" height="146" rx="6" fill="#1d3557"/>';
      s += '<path d="M63 32 L137 32 L63 120 Z" fill="rgba(255,255,255,.08)"/>';
      s += '<rect x="88" y="36" width="24" height="5" rx="2.500" fill="#050505"/>';
      s += '<path d="M72 150 H128" stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-linecap="round"/>';
    } else if(a.part==='battery'){
      s += '<rect x="48" y="52" width="104" height="106" rx="8" fill="#e8e8e8"/>';
      s += '<rect x="48" y="52" width="104" height="22" rx="8" fill="#cfcfcf"/>';
      s += '<rect x="86" y="42" width="28" height="12" rx="3" fill="#b0b0b0"/>';
      s += '<path d="M104 80 L90 112 H103 L96 142 L116 104 H103 Z" fill="#2b8a3e"/>';
    } else if(a.part==='camera'){
      s += '<rect x="52" y="52" width="96" height="104" rx="14" fill="#2a2a2a"/>';
      s += lens(100,104,30);
      s += '<rect x="64" y="152" width="72" height="22" rx="3" fill="#c9a24a"/>';
      s += '<path d="M70 156v14M80 156v14M90 156v14M100 156v14M110 156v14M120 156v14M130 156v14" stroke="#8a6d1f" stroke-width="2"/>';
    } else {
      s += '<rect x="46" y="30" width="108" height="150" rx="8" fill="#2f6b4f"/>';
      s += '<rect x="62" y="48" width="42" height="42" rx="4" fill="#1a1a1a"/>';
      s += '<rect x="112" y="48" width="28" height="28" rx="3" fill="#1a1a1a"/>';
      s += '<rect x="62" y="104" width="76" height="14" rx="2" fill="#c9a24a"/>';
      s += '<path d="M60 130 H110 V150 H140 M60 160 H90 V140" stroke="#9bd3b4" stroke-width="2" fill="none"/>';
      s += '<circle cx="136" cy="162" r="6" fill="#c9a24a"/>';
    }
    s += '</g></svg>';
    return s;
  }

  /* ---------- UI ---------- */
  var listings = [], tab = 'buy', query = '', cur = null, mode = 'buy', busy = false, editNick = false, tk = 0, nq;
  var ICON_TAG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-8 8a2 2 0 0 1-2.800 0L3 12z"/><circle cx="8" cy="8" r="1.300" fill="currentColor"/></svg>';

  function genListings(){ listings = []; for(var i=0;i<20;i++) listings.push(makeItem(i)); }
  function cardHTML(it,attr,price,sub,tag,rep){
    return '<button class="card" '+attr+'><div class="pic">'+art(it)+'</div>'+(tag?'<span class="tag'+(rep?' rep':'')+'">'+esc(tag)+'</span>':'')
      +'<div class="info"><div class="name">'+esc(it.title)+'</div><div class="price">'+price+'</div><div class="seller">'+esc(sub)+'</div></div></button>';
  }
  function mCard(it){
    var tag, rep = false;
    if(it.kind==='part'){ tag = (it.platform==='i'?'iPhone':'Android')+(it.q?' · '+it.q:''); }
    else if(it.kind==='case'){ tag = 'Кейс'; }

    if(window.crypto && crypto.subtle && window.TextEncoder){
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(x)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b), function(n){ return ('0'+n.toString(16)).slice(-2); }).join(''); });
    }
    var h = 5381; for(var i=0;i<x.length;i++){ h = ((h<<5)+h+x.charCodeAt(i))>>>0; }
    return Promise.resolve('d'+h);
  }

  function softRender(){
    if(tab!=='buy' || $('#sheet').classList.contains('show') || document.activeElement===$('#q')) return;
    var c = $('#content'), st = c.scrollTop; render(); c.scrollTop = st;
  }
  function refreshMarket(){
    if(!state.reg) return;
    api('/market').then(function(r){
      var arr = [], now = Date.now();
      for(var k in (r||{})){
        var m = r[k]; if(!m || m.sellerUid===state.uid || now-(m.t||0) > 6*3600*1000) continue;
        m.broken = m.broken || {}; COMPS.forEach(function(c){ m.broken[c] = !!m.broken[c]; });
        m.kind = 'phone'; m.player = true; m.cond = nb(m) ? 'fix' : 'ok'; m.rating = '5.0'; m.reviews = 0; m.delivery = 1; arr.push(m);
      }
      arr.sort(function(x,y){ return (y.t||0)-(x.t||0); });
      var sig = arr.map(function(m){ return m.id+m.price; }).join('|');
      if(sig===lastSig) return;
      lastSig = sig; players = arr; softRender();
    }).catch(function(){});
  }
  setInterval(refreshMarket, 5000);
  setInterval(function(){
    if(document.hidden || !state.reg) return;
    var tg = 20;
    if(Math.random()<0.4 && listings.length) listings.splice(rnd(0,listings.length-1),1);
    while(listings.length<tg) listings.push(makeItem(rnd(100,999)));
    softRender();
  }, 20000);
  $('#pwIn').addEventListener('input', function(){ $('#nickIn').classList.remove('err'); var h = $('#nickHint'); h.classList.remove('err'); h.textContent = 'От 2 до 16 символов'; });
  $('#pwIn').addEventListener('keydown', function(e){ if(e.key==='Enter'){ onNext(); } });

  /* ---------- события ---------- */
  $('#logoSmall').innerHTML = logoSVG(34);
  $('#logoBig').innerHTML = logoSVG(96);
  $('#content').addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('[data-id],[data-w],[data-cancel],[data-act],[data-case],[data-mycase]') : null; if(!t) return;
    if(t.hasAttribute('data-case')) return openCaseShop(t.getAttribute('data-case'));
    if(t.hasAttribute('data-mycase')) return openMyCase(t.getAttribute('data-mycase'));
    if(t.hasAttribute('data-id')) return openMarket(t.getAttribute('data-id'));
    if(t.hasAttribute('data-w')) return openWork(t.getAttribute('data-w'));
    if(t.hasAttribute('data-cancel')){
      var id = t.getAttribute('data-cancel'), ph = state.phones.filter(function(x){ return x.id===id; })[0];
      if(ph){ if(ph.ad && ph.ad.pub) api('/market/'+ph.id,'DELETE').catch(function(){}); delete ph.ad; save(); render(); notify('Объявление снято',''); }
      return;
    }
    var a = t.getAttribute('data-act');
    if(a==='editnick'){ editNick = true; render(); }
    else if(a==='cancelnick'){ editNick = false; render(); }
    else if(a==='savenick'){
      var v = $('#nickEd').value.trim(), h = $('#edHint');
      if(v.length<2 || v.length>16){ h.className = 'hint err'; h.textContent = 'Ник должен быть от 2 до 16 символов'; return; }
      if(v===state.nick){ editNick = false; render(); return; }
      checkNick(v).then(function(ok){
        if(!ok){ h.className = 'hint err'; h.textContent = 'Этот ник уже занят'; return; }
        claimNick(v,state.nick); state.nick = v; editNick = false; save(); flush(); render(); notify('Ник изменён','Теперь вы: '+v);
      });
    }
  });
  $('#shBody').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-fix],[data-reveal]') : null; if(!b) return;
    if(b.hasAttribute('data-fix')) startRepair(b.getAttribute('data-fix'));
    else startReveal();
  });
  $('#shBody').addEventListener('input', function(e){ if(e.target.id==='priceIn') upSell(); });
  var ORDER = ['buy','ali','shop','ads','prof'];
  $$('.tab').forEach(function(t){ t.addEventListener('click', function(){
    var nt = t.getAttribute('data-tab'), d = nt===tab ? '' : (ORDER.indexOf(nt)>ORDER.indexOf(tab) ? 'sl-r' : 'sl-l');
    tab = nt; editNick = false; render(d);
  }); });
  $('#closeSheet').addEventListener('click', function(){ if(!busy) closeSheet(); });
  $('#sheet').addEventListener('click', function(e){ if(e.target===this && !busy) closeSheet(); });
  $('#buyBtn').addEventListener('click', function(){ if(mode==='buy') buy(); else if(mode==='work') sell(); else if(mode==='caseshop') buyCaseShop(); else openCase(); });
  $('#nextBtn').addEventListener('click', onNext);
  $('#nickIn').addEventListener('input', function(){
    this.classList.remove('err'); var h = $('#nickHint'); h.classList.remove('err'); h.textContent = 'От 2 до 16 символов';
  });
  $('#nickIn').addEventListener('keydown', function(e){ if(e.key==='Enter'){ onNext(); } });
  $('#q').addEventListener('input', function(){ query = this.value; $('#search').classList.toggle('has', !!query); render(); });
  $('#clearQ').addEventListener('click', function(){ $('#q').value=''; query=''; $('#search').classList.remove('has'); render(); });

  /* ---------- запуск ---------- */
  load();
  if(state.nick && state.reg){ start(); refreshMarket(); } else { $('#onb').classList.add('show'); if(state.nick){ $('#nickIn').value = state.nick; setStep(2); } else { setStep(1); } updateBalance(); }
  api('/users/'+state.uid).then(function(r){
    if(state.reg && r && r.nick && (r.t||0) > state.t){ norm(r); try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} dirty = false; $('#onb').classList.remove('show'); start(); }
    net = 'on'; netText();
  }).catch(function(){ net = 'off'; netText(); });
})();
</script>
</body>
  </html>
