<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Объявка — ролик</title>
<style>
:root{--bg:#0b0b0b;--surface:#262626;--surface2:#1c1c1c;--line:#333;--text:#f2f2f2;--muted:#8c8c8c;--blue:#0af;--blue-d:#0088cc;--green:#04e061;--red:#ff4d4f;--yellow:#ffb400}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);user-select:none}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0}
#phone{position:absolute;width:420px;height:880px;transform-origin:0 0;background:var(--bg);overflow:hidden;opacity:0;transition:opacity .35s}
#phone.show{opacity:1}
#app{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{padding:14px 14px 8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand-name{font-size:21px;font-weight:700;letter-spacing:-.3px}
.balance{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:18px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .3s,color .3s}
.balance svg{color:var(--blue)}
.balance.up{background:rgba(4,224,97,.2);color:var(--green)}
.balance.up svg{color:var(--green)}
.searchwrap{padding:4px 14px 10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;height:48px}
.search svg{color:var(--muted);flex:none}
.search span{color:var(--muted);font-size:16px}
.content{flex:1;overflow:hidden;padding:4px 14px 20px}
.title{font-size:22px;font-weight:700;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;opacity:0;transform:translateY(-60px) rotate(-3deg)}
.card.in{animation:drop .5s cubic-bezier(.2,1.1,.4,1) forwards}
@keyframes drop{to{opacity:1;transform:none}}
.press{transform:scale(.96)!important;transition:transform .12s}
.card .pic{width:100%;aspect-ratio:1/1.05;display:block;background:#333}
.card .pic svg{width:100%;height:100%}
.card .info{padding:10px 12px 14px;display:flex;flex-direction:column;gap:3px}
.card .name{font-size:15px;line-height:1.25;min-height:38px}
.card .price{font-size:17px;font-weight:700;margin-top:2px}
.card .seller{font-size:13px;color:var(--muted)}
.tag{position:absolute;left:8px;top:8px;background:var(--blue);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px}
.tag.rep{background:#a24cf5}
.tabbar{display:flex;background:#101010;border-top:1px solid var(--line);padding:6px 6px 10px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;padding:4px 0;transition:color .2s}
.tab.on{color:var(--blue)}
.tab .ic{position:relative}
.badge{position:absolute;top:-4px;right:-10px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:none;align-items:center;justify-content:center;padding:0 4px}
.ad{display:flex;gap:12px;background:var(--surface);border-radius:14px;padding:10px;margin-bottom:12px}
.adp{width:96px;height:96px;border-radius:10px;overflow:hidden;flex:none}.adp svg{width:100%;height:100%}
.adi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.adi .name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adi .price{font-size:17px;font-weight:700}
.adt{font-size:13px;color:var(--muted)}
.adt.sold{color:var(--green);font-weight:700}
.bar{height:5px;background:#3a3a3a;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);width:0}
.cancel{align-self:flex-start;color:var(--red);font-size:14px;font-weight:600;padding:6px 0 0}
/* sheets */
.sheet{position:absolute;inset:0;z-index:20;display:none;background:var(--bg)}
.sheet.show{display:flex;flex-direction:column;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-top{padding:14px 14px 8px;display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.sh-top .balance{margin-left:auto}
.sh-body{flex:1;overflow:hidden;padding:0 14px 16px;position:relative}
.sh-in{transition:transform 1s cubic-bezier(.4,0,.2,1)}
.big{border-radius:16px;overflow:hidden;aspect-ratio:1/0.95;background:#333}
.big svg{width:100%;height:100%}
.d-price{font-size:30px;font-weight:800;margin-top:16px}
.d-name{font-size:20px;line-height:1.3;margin-top:4px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13px}
.chip.ok{color:var(--green)}.chip.warn{color:var(--yellow)}
.sec{font-size:17px;font-weight:700;margin:22px 0 8px}
.desc{line-height:1.5;color:#d0d0d0;font-size:15px}
.seller-box{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px;margin-top:22px}
.seller-box .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none}
.seller-box b{display:block;font-size:16px}
.seller-box small{color:var(--muted);font-size:13px;margin-top:2px;display:block}
.stars{color:var(--yellow)}
.sh-foot{padding:10px 14px 18px;border-top:1px solid var(--line);background:#101010}
.buy{width:100%;height:52px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.crow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.crow.br small{color:var(--red)}
.rbtn{background:var(--blue);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.okk{color:var(--green);font-weight:700}
.sellbox{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rec b{display:block;font-size:22px;margin-top:2px}
.rec small{color:var(--muted);font-size:13px}
.nickin{height:56px;border-radius:14px;background:var(--surface2);border:2px solid transparent;padding:0 16px;font-size:18px;width:100%;display:flex;align-items:center}
.nickin.f{border-color:var(--blue)}
.caret{display:inline-block;width:2px;height:22px;background:var(--blue);margin-left:1px;animation:bl .8s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.est{font-size:14px;font-weight:600}.est.g{color:var(--green)}.est.y{color:var(--yellow)}.est.r{color:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* note */
.note{position:absolute;left:50%;top:8px;transform:translateX(-50%) translateY(-160%);width:94%;background:#fff;color:#111;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.3,1);z-index:100}
.note.show{transform:translateX(-50%)}
.note .ni{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.note .ni.g{background:var(--green)}
.note b{display:block;font-size:15px}.note span{font-size:13px;color:#555}
/* repair */
.rep{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center}
.rep.show{display:flex}
.rep-in{display:flex;flex-direction:column;align-items:center;gap:20px;width:76%;max-width:320px}
.rp-wrap{position:relative;width:150px;height:290px;animation:shk .45s ease-in-out infinite}
.rp-wrap .ph{filter:drop-shadow(0 0 18px rgba(0,170,255,.7));animation:glw 1s ease-in-out infinite alternate}
.scan{animation:scn 1.1s linear infinite}
.tool{position:absolute;right:-34px;top:70px;color:#fff;transform-origin:25% 80%;animation:wr .5s ease-in-out infinite alternate}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd24a;box-shadow:0 0 8px #ffd24a;opacity:0;animation:spk .9s ease-out infinite}
.chk{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--green)}
.rep.done .chk{display:flex;animation:pop .4s ease-out}
.rep.done .ph{filter:drop-shadow(0 0 30px rgba(4,224,97,.95));animation:none}
.rep.done .scan,.rep.done .tool,.rep.done .sp{display:none}
.rep.done .rp-wrap{animation:none}
.rp-t{font-size:17px;font-weight:600}
.rp-bar{width:100%;height:8px;background:#333;border-radius:4px;overflow:hidden}.rp-bar i{display:block;height:100%;width:0;background:var(--blue)}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
@keyframes glw{from{filter:drop-shadow(0 0 8px rgba(0,170,255,.4))}to{filter:drop-shadow(0 0 26px rgba(0,170,255,.95))}}
@keyframes scn{from{transform:translateY(0)}to{transform:translateY(250px)}}
@keyframes wr{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
@keyframes spk{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
/* fx */
.tap{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.8);z-index:200;pointer-events:none;animation:tp .55s ease-out forwards}
@keyframes tp{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:150;pointer-events:none}
#flash.go{animation:fl .8s ease-out}
@keyframes fl{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.bd{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;z-index:140;pointer-events:none;animation:bs 1.3s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes bs{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
#plus{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:62px;font-weight:900;color:var(--green);text-shadow:0 0 30px rgba(4,224,97,.8);z-index:145;opacity:0;pointer-events:none}
#plus.go{animation:pl 2.4s ease-out forwards}
@keyframes pl{0%{opacity:0;transform:translateY(30px) scale(.5)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
#fin{position:absolute;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;pointer-events:none;transition:opacity .5s}
#fin.show{opacity:1}
#fin .lg circle{transform-box:fill-box;transform-origin:center;transform:scale(0)}
#fin.show .lg circle{animation:cp .6s cubic-bezier(.2,1.5,.4,1) forwards}
#fin.show .lg circle:nth-child(2){animation-delay:.12s}#fin.show .lg circle:nth-child(3){animation-delay:.24s}#fin.show .lg circle:nth-child(4){animation-delay:.36s}
@keyframes cp{to{transform:scale(1)}}
#fin .nm{font-size:50px;font-weight:700;letter-spacing:-1px;opacity:0;transform:translateY(16px)}
#fin.show .nm{animation:nm .6s .6s ease forwards}
@keyframes nm{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="phone">
  <div id="app">
    <div class="top">
      <div class="brand"><div id="logoSmall"></div><span class="brand-name">Объявка</span></div>
      <div class="balance" id="bal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor"/></svg><span class="bal-val">5 000 ₽</span></div>
    </div>
    <div class="searchwrap" id="searchWrap"><div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Телефоны, запчасти и другое</span></div></div>
    <div class="content" id="content"></div>
    <nav class="tabbar">
      <div class="tab on" id="tb-buy"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.2 12.2a1 1 0 0 1-1 1.1H5.8a1 1 0 0 1-1-1.1L6 7z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg></span><span>Закупка</span></div>
      <div class="tab" id="tb-ali"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg></span><span>Алиэкспресс</span></div>
      <div class="tab" id="tb-shop"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5 5L3.5 17.5a2 2 0 0 0 2.8 2.8l6.2-6.2a4 4 0 0 0 5-5l-2.6 2.6-2.4-.6-.6-2.4 2.8-2.4z"/></svg></span><span>Мастерская</span></div>
      <div class="tab" id="tb-ads"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-8 8a2 2 0 0 1-2.8 0L3 12z"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/></svg><b class="badge" id="adsBadge">1</b></span><span>Объявления</span></div>
      <div class="tab" id="tb-prof"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4 4-6 8-6s7.4 2 8 6"/></svg></span><span>Профиль</span></div>
    </nav>
  </div>

  <!-- карточка покупки -->
  <div class="sheet" id="sheetBuy">
    <div class="sh-top"><div class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></div><div class="balance"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor"/></svg><span class="bal-val">5 000 ₽</span></div></div>
    <div class="sh-body" id="buyBody"></div>
    <div class="sh-foot"><div class="buy" id="buyBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.2 12.2a1 1 0 0 1-1 1.1H5.8a1 1 0 0 1-1-1.1L6 7z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg><span>Купить</span></div></div>
  </div>

  <!-- мастерская: телефон -->
  <div class="sheet" id="sheetWork">
    <div class="sh-top"><div class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></div><div class="balance"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor"/></svg><span class="bal-val">3 000 ₽</span></div></div>
    <div class="sh-body"><div class="sh-in" id="workIn"></div></div>
    <div class="sh-foot"><div class="buy" id="sellBtn"><span id="sellLbl">Выставить за 12 000 ₽</span></div></div>
  </div>

  <div class="note" id="note"><div class="ni" id="noteI"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.500 4.500L19 7.500"/></svg></div><div><b id="noteB"></b><span id="noteS"></span></div></div>

  <div class="rep" id="rep"><div class="rep-in">
    <div class="rp-wrap" id="rpWrap">
      <svg class="ph" viewBox="0 0 160 300" width="150" height="290"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0af" stop-opacity="0"/><stop offset=".5" stop-color="#0af" stop-opacity=".8"/><stop offset="1" stop-color="#0af" stop-opacity="0"/></linearGradient><clipPath id="sc"><rect x="22" y="14" width="116" height="272" rx="20"/></clipPath></defs>
        <rect x="10" y="4" width="140" height="292" rx="28" fill="#1c1c1e" stroke="#6a6a6e" stroke-width="3"/>
        <rect x="22" y="14" width="116" height="272" rx="20" fill="#0d2238"/>
        <g clip-path="url(#sc)"><rect class="scan" x="22" y="10" width="116" height="40" fill="url(#sg)"/></g>
        <rect x="60" y="22" width="40" height="12" rx="6" fill="#000"/>
        <rect x="38" y="80" width="84" height="10" rx="5" fill="rgba(255,255,255,.14)"/><rect x="38" y="104" width="60" height="10" rx="5" fill="rgba(255,255,255,.14)"/>
        <rect x="38" y="200" width="84" height="48" rx="12" fill="rgba(0,170,255,.25)"/>
      </svg>
      <svg class="tool" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5 5L3.5 17.5a2 2 0 0 0 2.8 2.8l6.2-6.2a4 4 0 0 0 5-5l-2.6 2.6-2.4-.6-.6-2.4 2.8-2.4z"/></svg>
      <div class="chk"><svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg></div>
    </div>
    <div class="rp-t" id="rpT"></div>
    <div class="rp-bar"><i id="rpBar"></i></div>
  </div></div>

  <div id="flash"></div>
  <div id="plus">+10 000 ₽</div>
  <div id="fin"><div class="lg" id="finLogo"></div><div class="nm">Объявка</div></div>
</div>

<script>
(function(){
  var PREP = 3000, started = false;
  var C = { teal:'#a0e4d4', orange:'#fda57d', green:'#a3b88f', purple:'#c8a5cb' };
  var BODY = [['#1f1f1f','#2c2c2c'],['#d8c9b0','#c9b898'],['#e6e6e6','#cfcfcf'],['#2b3a55','#3a4b6b'],['#cbd5c0','#b4c2a6'],['#3b2f3f','#4c3d52']];
  function $(id){ return document.getElementById(id); }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0') + '\u00A0₽'; }

  /* ---- логотип и арт — из приложения ---- */
  function logoSVG(size){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true">'
      +'<circle cx="30" cy="31" r="25" fill="'+C.teal+'"/><circle cx="77" cy="26" r="19" fill="'+C.orange+'"/>'
      +'<circle cx="68" cy="71" r="27" fill="'+C.green+'"/><circle cx="19" cy="80" r="17" fill="'+C.purple+'"/></svg>';
  }
  function avatarSVG(ch,a,b,c){
    return '<svg viewBox="0 0 100 100" width="100%" height="100%"><rect width="100" height="100" fill="'+a+'"/><circle cx="82" cy="20" r="26" fill="'+b+'"/><circle cx="16" cy="92" r="30" fill="'+c+'"/><text x="50" y="66" text-anchor="middle" font-size="46" font-weight="700" fill="#1a1a1a" font-family="Arial,sans-serif">'+ch+'</text></svg>';
  }
  function lens(cx,cy,r){
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#161616" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.55)+'" fill="#26427a"/><circle cx="'+(cx-r*0.2)+'" cy="'+(cy-r*0.2)+'" r="'+(r*0.18)+'" fill="rgba(255,255,255,.7)"/>';
  }
  function art(it){
    var a = it.art, w = 200, h = 210, bc = BODY[a.body];
    var s = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect width="'+w+'" height="'+h+'" fill="'+a.bg+'"/>';
    s += '<circle cx="'+(a.tilt>0?170:30)+'" cy="30" r="46" fill="rgba(255,255,255,.18)"/><circle cx="'+(a.tilt>0?40:165)+'" cy="195" r="58" fill="rgba(0,0,0,.08)"/>';
    s += '<g transform="rotate('+a.tilt+' 100 105)">';
    s += '<rect x="58" y="22" width="84" height="166" rx="14" fill="'+bc[0]+'"/>';
    s += '<path d="M58 70 L142 52 L142 120 L58 150 Z" fill="'+bc[1]+'" opacity=".55"/>';
    if(a.style==='round'){
      s += '<circle cx="100" cy="64" r="26" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.2)"/>';
      var pts = a.cams===1?[[100,64]]:a.cams===2?[[91,64],[109,64]]:[[100,52],[89,72],[111,72]];
      pts.forEach(function(p){ s += lens(p[0],p[1],a.cams>2?7.5:9); });
    } else if(a.style==='bar'){
      s += '<rect x="68" y="32" width="24" height="'+(10+a.cams*17)+'" rx="12" fill="rgba(0,0,0,.4)"/>';
      for(var k=0;k<a.cams;k++){ s += lens(80,44+k*17,7); }
    } else {
      s += '<rect x="68" y="32" width="38" height="22" rx="11" fill="rgba(0,0,0,.4)"/>'+lens(79,43,7)+lens(95,43,7)+'<circle cx="124" cy="40" r="3" fill="#ffd966"/>';
    }
    if(it.cond==='fix'){
      s += '<g stroke="rgba(255,255,255,.8)" stroke-width="1.4" fill="none" stroke-linecap="round"><path d="M142 120 L118 132 L110 160 L96 170"/><path d="M118 132 L132 150"/><path d="M110 160 L124 182"/><path d="M118 132 L100 128 L88 140"/></g>';
    }
    return s + '</g></svg>';
  }

  /* ---- данные ---- */
  var ITEMS = [
    {id:'c1',title:'Samsung Galaxy A10, 2/32 ГБ',price:2000,seller:'tech_fox',cond:'fix',tag:'Сломано: 1',art:{bg:C.teal,body:0,cams:2,style:'round',tilt:-7}},
    {id:'c2',title:'iPhone 7, 32 ГБ',price:3500,seller:'korobka',cond:'fix',tag:'Сломано: 2',art:{bg:C.orange,body:2,cams:1,style:'round',tilt:6}},
    {id:'c3',title:'Redmi 9A, 2/32 ГБ',price:2400,seller:'sima_phone',cond:'fix',tag:'Сломано: 3',art:{bg:C.purple,body:3,cams:2,style:'bar',tilt:8}},
    {id:'c4',title:'iPhone XR, 64 ГБ',price:4100,seller:'GadgetDen',cond:'fix',tag:'Сломано: 2',art:{bg:C.green,body:5,cams:2,style:'sq',tilt:-5}}
  ];
  var A10 = ITEMS[0];
  var okArt = {title:A10.title,cond:'ok',art:A10.art};

  function card(it){
    return '<div class="card" id="'+it.id+'"><div class="pic">'+art(it)+'</div><span class="tag rep">'+it.tag+'</span><div class="info"><div class="name">'+it.title+'</div><div class="price">'+fmt(it.price)+'</div><div class="seller">'+it.seller+'</div></div></div>';
  }
  var marketHTML = '<div class="grid">'+ITEMS.map(card).join('')+'</div>';

  /* ---- init DOM ---- */
  $('logoSmall').innerHTML = logoSVG(32);
  $('finLogo').innerHTML = logoSVG(170).replace('<svg','<svg class="lg"');
  $('content').innerHTML = marketHTML;
  $('buyBody').innerHTML =
    '<div class="big">'+art(A10)+'</div><div class="d-price">'+fmt(A10.price)+'</div><div class="d-name">'+A10.title+'</div>'
    +'<div class="chips"><span class="chip">Телефон</span><span class="chip warn">Требует ремонта</span></div>'
    +'<div class="sec">Описание</div><div class="desc">Разбито стекло, остальное работает. Берите, пока не ушёл.</div>'
    +'<div class="seller-box"><div class="av">'+avatarSVG('T',C.teal,C.orange,C.purple)+'</div><div><b>tech_fox</b><small><span class="stars">★★★★★</span> 4.8 · 212 отзывов</small></div></div>';
  function workHTML(fixed){
    return '<div class="big" id="wBig">'+art(fixed?okArt:A10)+'</div><div class="d-name" style="margin-top:16px">'+A10.title+'</div>'
      +'<div class="chips" id="wChips">'+(fixed?'<span class="chip ok">Рабочий</span>':'<span class="chip warn">Требует ремонта</span>')+'</div>'
      +'<div class="sec">Компоненты</div>'
      +'<div class="crow"><div><b>Аккумулятор</b><small>Исправен</small></div><span class="okk">OK</span></div>'
      +'<div class="crow'+(fixed?'':' br')+'" id="glassRow"><div><b>Стекло</b><small>'+(fixed?'Исправен':'Сломан')+'</small></div>'+(fixed?'<span class="okk">OK</span>':'<div class="rbtn" id="fixBtn">Починить</div>')+'</div>'
      +'<div class="crow"><div><b>Корпус</b><small>Исправен</small></div><span class="okk">OK</span></div>'
      +'<div class="sec" id="sellSec">Продажа</div><div class="sellbox" id="sellbox"><div class="rec"><small>Рекомендуемая цена</small><b>'+fmt(12000)+'</b><small>выручка около +'+fmt(10000)+'</small></div>'
      +'<div class="nickin" id="priceBox"><span id="priceTxt"></span></div><div class="est g" id="est"></div></div><div style="height:260px"></div>';
  }
  $('workIn').innerHTML = workHTML(false);

  /* ---- масштаб ---- */
  var S = 1;
  function fit(){
    S = Math.min(innerWidth/420, innerHeight/880);
    var p = $('phone'); p.style.transform = 'scale('+S+')';
    p.style.left = ((innerWidth-420*S)/2)+'px'; p.style.top = ((innerHeight-880*S)/2)+'px';
  }
  fit(); addEventListener('resize', fit);

  /* ---- звук ---- */
  var ac = null;
  function beep(f,d,t,v,delay){
    if(!ac) return;
    var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + (delay||0);
    o.type = t||'sine'; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.12,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+d+.02);
  }
  function sClick(){ beep(900,.07,'triangle',.1); }
  function sDing(){ beep(1175,.35,'sine',.16); beep(1568,.5,'sine',.14,.12); beep(2093,.6,'sine',.12,.26); }
  function sBuy(){ beep(520,.12,'triangle',.12); beep(390,.18,'triangle',.1,.08); }
  function sDone(){ beep(660,.12,'sine',.12); beep(880,.2,'sine',.12,.1); }

  /* ---- голос ---- */
  var voice = null;
  function pickVoice(){
    var v = speechSynthesis.getVoices().filter(function(x){ return /^ru/i.test(x.lang); });
    voice = v.filter(function(x){ return /male|муж|pavel|yuri|dmitry|google/i.test(x.name); })[0] || v[0] || null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(t){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'ru-RU'; if(voice) u.voice = voice; u.rate = 1.3; u.pitch = .95; u.volume = 1;
    speechSynthesis.speak(u);
  }

  /* ---- хелперы ---- */
  var tm = [];
  function at(ms,fn){ tm.push(setTimeout(fn, PREP+ms)); }
  function tap(el){
    var r = el.getBoundingClientRect(), p = $('phone').getBoundingClientRect();
    var d = document.createElement('div'); d.className = 'tap';
    d.style.left = ((r.left+r.width/2-p.left)/S)+'px'; d.style.top = ((r.top+r.height/2-p.top)/S)+'px';
    $('phone').appendChild(d); setTimeout(function(){ d.remove(); },600);
    el.classList.add('press'); setTimeout(function(){ el.classList.remove('press'); },170); sClick();
  }
  function tabOn(id){ ['buy','ali','shop','ads','prof'].forEach(function(k){ $('tb-'+k).classList.toggle('on',k===id); }); }
  function setBal(n){ [].forEach.call(document.querySelectorAll('.bal-val'),function(e){ e.textContent = fmt(n); }); }
  function animBal(a,b,dur){
    var t0 = performance.now();
    [].forEach.call(document.querySelectorAll('.balance'),function(e){ e.classList.toggle('up', b>a); });
    (function f(now){
      var p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,3);
      setBal(Math.round(a+(b-a)*e)); if(p<1) requestAnimationFrame(f);
    })(t0);
    setTimeout(function(){ [].forEach.call(document.querySelectorAll('.balance'),function(e){ e.classList.remove('up'); }); }, dur+500);
  }
  function note(b,s,g){
    $('noteB').textContent = b; $('noteS').textContent = s;
    $('noteI').className = 'ni'+(g?' g':''); $('note').classList.add('show');
  }
  function noteOff(){ $('note').classList.remove('show'); }

  /* ---- ремонт ---- */
  function repair(){
    var ov = $('rep'), bar = $('rpBar'), w = $('rpWrap');
    [].forEach.call(w.querySelectorAll('.sp'),function(e){ w.removeChild(e); });
    for(var i=0;i<14;i++){
      var sp = document.createElement('span'); sp.className = 'sp';
      sp.style.left = (118+Math.random()*30)+'px'; sp.style.top = (95+Math.random()*40)+'px';
      sp.style.setProperty('--x',(Math.random()*70-10)+'px'); sp.style.setProperty('--y',(Math.random()*-70-5)+'px');
      sp.style.animationDelay = (Math.random()*.8)+'s'; w.appendChild(sp);
    }
    ov.className = 'rep show'; $('rpT').textContent = 'Стекло: замена…';
    bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth;
    bar.style.transition = 'width 1.5s linear'; bar.style.width = '100%';
  }

  /* ---- цена ---- */
  function setPrice(v,cls,est){
    $('priceTxt').textContent = v; $('est').textContent = est; $('est').className = 'est '+cls;
    $('sellLbl').textContent = 'Выставить за '+(v||'0');
  }
  function typePrice(str,step,cb){
    var i = 0; $('priceBox').classList.add('f');
    (function n(){ i++; var v = str.slice(0,i); $('priceTxt').textContent = v.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0'); $('sellLbl').textContent = 'Выставить за '+fmt(+v);
      if(i<str.length) setTimeout(n,step); else if(cb) cb(); })();
  }

  /* ---- ролик ---- */
  function start(){
    if(started) return; started = true;
    document.body.style.cursor = 'none';
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}

    // 3 секунды подготовки: чёрный экран без надписей

    // ---- 0–4: Закупка, разбитые телефоны ----
    at(0, function(){ $('phone').classList.add('show'); });
    [0,1,2,3].forEach(function(i){ at(250+i*260,function(){ $('c'+(i+1)).classList.add('in'); }); });
    at(100, function(){ say('Смотрите, какую дичь я нашёл. Тут ты перекупщик телефонов.'); });
    at(2900, function(){ tap($('c1')); });

    // ---- 4–9: покупка и ремонт ----
    at(3300, function(){ $('sheetBuy').classList.add('show'); });
    at(4000, function(){ say('Берёшь вот этот хлам за две тысячи, чинишь его в мастерской.'); });
    at(4500, function(){ tap($('buyBtn')); });
    at(4800, function(){ sBuy(); animBal(5000,3000,600); note('Покупка: '+A10.title,'Списано '+fmt(2000)+' · телефон в мастерской'); });
    at(5500, function(){
      noteOff(); $('sheetBuy').classList.remove('show'); tabOn('shop'); $('searchWrap').style.display = 'none';
      $('content').innerHTML = '<div class="title">Мастерская</div><div class="ad" id="myPh"><div class="adp">'+art(A10)+'</div><div class="adi"><div class="name">'+A10.title+'</div><div class="price">Куплен за '+fmt(2000)+'</div><div class="adt" style="color:var(--yellow)">Требует ремонта</div></div></div>';
    });
    at(6100, function(){ tap($('myPh')); });
    at(6400, function(){ $('sheetWork').classList.add('show'); setBal(3000); });
    at(7000, function(){ tap($('fixBtn')); });
    at(7300, function(){ repair(); });
    at(8800, function(){ $('rep').classList.add('done'); $('rpT').textContent = 'Готово'; sDone(); });
    at(9150, function(){
      $('rep').className = 'rep';
      $('wBig').innerHTML = art(okArt);
      $('wChips').innerHTML = '<span class="chip ok">Рабочий</span>';
      var g = $('glassRow'); g.className = 'crow'; g.innerHTML = '<div><b>Стекло</b><small>Исправен</small></div><span class="okk">OK</span>';
    });

    // ---- 9–15: цена ----
    at(9000, function(){ say('И выставляешь на продажу. Главное — не завысить, а то будет висеть вечность.'); });
    at(9300, function(){ var s = $('sellSec').offsetTop - 250; $('workIn').style.transform = 'translateY(-'+Math.max(0,s)+'px)'; });
    at(10500, function(){ tap($('priceBox')); });
    at(10900, function(){ typePrice('12000',140,function(){ setPrice('12 000','g','Ожидание: ~15 сек'); $('priceTxt').textContent = fmt(12000).replace('\u00A0₽',''); $('est').textContent = 'Ожидание: ~15 сек'; $('est').className = 'est g'; }); });
    at(12000, function(){ $('priceTxt').textContent = '40 000'; $('sellLbl').textContent = 'Выставить за '+fmt(40000); $('est').textContent = 'Ожидание: ~5 сут'; $('est').className = 'est r'; $('sellbox').classList.add('shake'); beep(180,.3,'sawtooth',.08); });
    at(13300, function(){ $('sellbox').classList.remove('shake'); $('priceTxt').textContent = '12 000'; $('sellLbl').textContent = 'Выставить за '+fmt(12000); $('est').textContent = 'Ожидание: ~15 сек'; $('est').className = 'est g'; });
    at(14000, function(){ tap($('sellBtn')); });
    at(14300, function(){
      $('sheetWork').classList.remove('show'); tabOn('ads'); sBuy();
      $('content').innerHTML = '<div class="title">Объявления</div><div class="ad"><div class="adp">'+art(okArt)+'</div><div class="adi"><div class="name">'+A10.title+'</div><div class="price">'+fmt(12000)+'</div><div class="adt" id="adT">Ждём покупателя: 0:12</div><div class="bar"><i id="adB" style="transition:width .7s linear"></i></div><div class="cancel">Снять объявление</div></div></div>';
      setTimeout(function(){ $('adB').style.width = '92%'; },60);
    });

    // ---- 15–19: продано ----
    at(15000, function(){
      say('О, купили! Плюс десять штук нахуй!');
      $('flash').classList.add('go'); sDing();
      var t = $('adT'); t.textContent = 'Продано'; t.className = 'adt sold'; $('adB').style.width = '100%'; $('adB').style.background = 'var(--green)';
      note('Продано!', A10.title+' · +'+fmt(12000), true);
      animBal(3000,15000,1700);
      var cols = [C.teal,C.orange,C.green,C.purple];
      for(var i=0;i<22;i++){
        var d = document.createElement('div'), ang = Math.random()*Math.PI*2, dist = 140+Math.random()*190;
        d.className = 'bd'; d.style.left = '210px'; d.style.top = '400px'; d.style.background = cols[i%4];
        d.style.setProperty('--x',Math.cos(ang)*dist+'px'); d.style.setProperty('--y',Math.sin(ang)*dist+'px');
        d.style.width = d.style.height = (12+Math.random()*20)+'px';
        $('phone').appendChild(d); (function(x){ setTimeout(function(){ x.remove(); },1500); })(d);
      }
    });
    at(15500, function(){ $('plus').classList.add('go'); });
    at(18500, function(){ noteOff(); });

    // ---- 19–22: логотип ----
    at(19000, function(){ $('fin').classList.add('show'); sDone(); });
    at(19100, function(){ say('В общем, ссылка в профиле, качайте.'); });
  }

  ['click','touchend','keydown'].forEach(function(ev){
    document.addEventListener(ev,function(){
      if('speechSynthesis' in window){ var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
      start();
    });
  });
})();
</script>
</body>
</html>
